#####################################################################
# Voron V0.2 - Manta M4P + Orbitool O2S

[include config_backup.cfg]
[include 1.mick_macro_pack.cfg]
[include mainsail.cfg]
[include shell_command.cfg]
#####################################################################
# MCUs
#####################################################################

[mcu]
# Manta M4P - replace with output from:
# ls -l /dev/serial/by-id/
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_480052000C50415833323420-if00

[mcu CB1]
serial: /tmp/klipper_host_mcu

[mcu orbitoolO2S]
# Official Orbitool O2S USB ID
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_2F002A001657484337313820-if00
restart_method: command

#####################################################################
# Virtual SD / Printer
#####################################################################

[virtual_sdcard]
path: ~/printer_data/gcodes

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[idle_timeout]
timeout: 1800

#####################################################################
# Temperature monitoring / electronics fan
#####################################################################

[temperature_sensor Manta_M4P]
sensor_type: temperature_mcu
#####################################################################
# X/Y STEPPERS - Manta M4P
# Sensorless homing retained from the original V0.2 base config.
#####################################################################

[stepper_x]
step_pin: PC6
dir_pin: PA14
enable_pin: !PC7
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 118
position_max: 118
homing_speed: 30
homing_retract_dist: 0
homing_positive_dir: true
step_pulse_duration: 0.000001

[tmc2209 stepper_x]
uart_pin: PB12
interpolate: False
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 200
diag_pin: ^PC0
driver_SGTHRS: 70

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 120
position_max: 120
homing_speed: 30
homing_retract_dist: 0
homing_positive_dir: true
step_pulse_duration: 0.000001

[tmc2209 stepper_y]
uart_pin: PC10
interpolate: False
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 200
diag_pin: ^PC1
driver_SGTHRS: 70

#####################################################################
# Z STEPPER - Manta M4P
#####################################################################

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
rotation_distance: 8
microsteps: 32
endstop_pin: ^PC2
#position_endstop: 120
position_max: 120
position_min: -1.5
homing_speed: 10
second_homing_speed: 3.0
homing_retract_dist: 5.0

[tmc2209 stepper_z]
uart_pin: PC9
run_current: 0.5500
interpolate: False
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# EXTRUDER - Orbitool O2S onboard TMC2240
#####################################################################


[extruder]
step_pin: orbitoolO2S:PB3
dir_pin: orbitoolO2S:PB4
enable_pin: !orbitoolO2S:PC14
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.60
nozzle_diameter: 0.400 #define nozzle diameter
filament_diameter: 1.750
max_extrude_only_distance: 500
max_extrude_cross_section: 6.00
max_extrude_only_velocity: 120
heater_pin: orbitoolO2S:PB9
sensor_pin: orbitoolO2S:PA1
pullup_resistor: 2200
#sensor_type: ATC Semitec 104GT-2
sensor_type: Generic 3950
#control: pid
#pid_kp = 35.464
#pid_ki = 14.776
#pid_kd = 21.279
min_temp: 0
max_temp: 300
min_extrude_temp: 170
pressure_advance: 0.015
pressure_advance_smooth_time: 0.03
smooth_time: 0.5
max_power: 0.995
step_pulse_duration: 0.000004

[tmc2240 extruder]
uart_pin: orbitoolO2S:PC13
interpolate: False
run_current: 0.85
rref: 12000
stealthchop_threshold: 0

#####################################################################
# BED - Manta M4P
#####################################################################

[heater_bed]
heater_pin: PD8
sensor_pin: PC4
sensor_type: ATC Semitec 104GT-2
#control: watermark
min_temp: 0
max_temp: 110
max_power: 1.0

#####################################################################
# TOOLHEAD FANS - Orbitool O2S
#####################################################################

# Hotend fan - O2S HOT FAN connector
[heater_fan hotend_fan]
pin: !orbitoolO2S:PB15
#tachometer_pin: orbitoolO2S:PB12
#tachometer_ppr: 2
#tachometer_poll_interval: 0.0005
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
cycle_time: 0.0001
hardware_pwm: False
shutdown_speed: 0.0
max_power: 1.0

# Part cooling fan - configured for 2-wire / 3-wire fan.
# O2S part-fan voltage jumper:
#   OPEN   = 24V
#   CLOSED = 12V
[fan]
pin: !orbitoolO2S:PA10
enable_pin: orbitoolO2S:PB14
off_below: 0.2
#tachometer_pin: orbitoolO2S:PA14
#tachometer_ppr: 2
#tachometer_poll_interval: 0.0005
shutdown_speed: 0.0
cycle_time: 0.0001
kick_start_time: 0.2
hardware_pwm: False

#####################################################################
# Orbitool O2S onboard ADXL345
#####################################################################

[adxl345 Tool0]
cs_pin: orbitoolO2S:PA4
spi_bus: spi1
axes_map: y,z,x
spi_speed: 5000000

[resonance_tester]
accel_chip: adxl345 Tool0
probe_points:
    59,59,20
#####################################################################
# Orbitool O2S LEDs
#####################################################################

[output_pin O2S_RUN_LED]
pin: orbitoolO2S:PB13
value: 1
shutdown_value: 0

#[neopixel OrbiLED]
#pin: orbitoolO2S:PC15
#chain_count: 2
#color_order: GRB
#initial_RED: 0.0
#initial_GREEN: 0.0
#initial_BLUE: 0.1

