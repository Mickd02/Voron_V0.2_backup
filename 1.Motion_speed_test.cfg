[gcode_macro MOTION_NOISE_TEST]
description: Test XY motors around perimeter and diagonally
gcode:
    {% set cycles = params.CYCLES|default(5)|int %}
    {% set speed = params.SPEED|default(120)|float %}
    {% set feed = speed * 60 %}

    SAVE_GCODE_STATE NAME=MOTION_NOISE_TEST_STATE

    G90
    G1 Z10 F600

    {% for cycle in range(cycles) %}
        # Perimeter
        G1 X10  Y10  F{feed}
        G1 X108 Y10  F{feed}
        G1 X108 Y110 F{feed}
        G1 X10  Y110 F{feed}
        G1 X10  Y10  F{feed}

        # Diagonal cross
        G1 X108 Y110 F{feed}
        G1 X10  Y110 F{feed}
        G1 X108 Y10  F{feed}
        G1 X10  Y10  F{feed}
    {% endfor %}

    G1 X59 Y60 F{feed}
    RESTORE_GCODE_STATE NAME=MOTION_NOISE_TEST_STATE