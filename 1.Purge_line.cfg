[gcode_macro PURGE_LINE]
description: Purge line across front of V0.2 bed
gcode:
    SAVE_GCODE_STATE NAME=purge_line_state

    G90
    M83

    # Move to front-left
    G1 Z5 F3000
    G1 X10 Y1 F6000
    G1 Z0.30 F1000

    # Prime
    G1 E3 F180

    # Purge line across front
    G1 X110 E12 F900

    # Small retract
    G1 E-0.5 F1200

    # Lift and move away
    G1 Z2 F1000
    G1 X115 F6000

    RESTORE_GCODE_STATE NAME=purge_line_state